name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skillsync
          POSTGRES_USER: skillsync
          POSTGRES_PASSWORD: skillsync
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skillsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgres://skillsync:skillsync@localhost:5432/skillsync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check --deploy --fail-level ERROR
      - run: python manage.py makemigrations --check --dry-run
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80
