databases:
  - name: skillsync-db
    databaseName: skillsync
    user: skillsync

services:
  - type: web
    name: skillsync-api
    runtime: python
    branch: master
    buildCommand: bash build.sh
    startCommand: gunicorn skillsync.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: skillsync-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
