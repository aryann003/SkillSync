services:
  - type: web
    name: skillsync-api
    runtime: python
    plan: free
    branch: master
    buildCommand: bash build.sh
    startCommand: gunicorn skillsync.wsgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
